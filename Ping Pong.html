<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RZK Pong</title>
<style>
:root{color-scheme:dark;--bg:#090d1b;--surface:#121a30;--ink:#eef3ff;--muted:#9aa8c8;--line:#253252;--accent:#7c6cff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{min-height:100%;background:radial-gradient(ellipse at 50% 0%,#1d2450 0%,var(--bg) 62%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 16px}
.wrap,.bar{width:min(100%,900px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:rgba(18,26,48,.9);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 8px 28px #0003}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:650;padding:7px 16px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.seg button:hover{color:var(--ink);transform:translateY(-1px)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,#8274ff,#4ea8ff);color:white;box-shadow:0 3px 14px #695cff66}
.seg button:focus-visible{outline:2px solid #71dbff;outline-offset:2px}
.hint{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px}
.action{border:1px solid #344268;border-radius:999px;background:#121a30;color:var(--ink);font:inherit;font-size:12px;font-weight:700;padding:8px 13px;cursor:pointer}
.action:hover:not(:disabled){border-color:#71dbff;color:#9ff8ff}
.action:disabled{opacity:.45;cursor:default}
.action:focus-visible{outline:2px solid #71dbff;outline-offset:2px}
canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;background:#0d1429;border:1px solid #344268;border-radius:20px;touch-action:none;box-shadow:0 22px 70px #0008,0 0 42px #6260ff20;cursor:crosshair}
@media(max-width:600px){body{gap:12px;padding:14px 10px}.bar{justify-content:center}.hint{text-align:center;font-size:12px;flex-basis:100%;order:3}.seg button{padding:7px 13px}canvas{border-radius:14px}}
</style>
</head>
<body>
<div class="bar">
  <div class="seg" id="seg" role="group" aria-label="Tingkat kesulitan">
    <button data-d="0" aria-pressed="false">Mudah</button>
    <button data-d="1" aria-pressed="true">Sedang</button>
    <button data-d="2" aria-pressed="false">Sulit</button>
  </div>
  <div class="hint">Gerakkan mouse / sentuh atau A/D dan ←/→. Ambil senjata dari blok, lalu klik kiri, tekan F, atau TEMBAK.</div>
  <div class="actions">
    <button class="action" id="fireButton" type="button" disabled>TEMBAK · F</button>
    <button class="action" id="soundButton" type="button" aria-pressed="true">🔊 Suara ON</button>
  </div>
</div>
<div class="wrap"><canvas id="c" width="800" height="500" aria-label="RZK Pong: hancurkan blok dan hadapi bos pixel RZK yang menembak"></canvas></div>

function beep(freq,duration,wave='sine',volume=.045,slide=0){
  if(!soundEnabled)return;
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!audioCtx)audioCtx=new AudioContextClass();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type=wave;osc.frequency.setValueAtTime(freq,now);
  if(slide)osc.frequency.linearRampToValueAtTime(freq+slide,now+duration);
  gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.02);
}
function playSound(name){
  if(name==='start'){beep(360,.12,'triangle',.04,180);beep(620,.2,'sine',.035,120)}
  if(name==='paddle')beep(190,.07,'square',.025,-50);
  if(name==='brick'){beep(320,.08,'triangle',.035,160)}
  if(name==='pickup'){beep(540,.11,'sine',.045,240);beep(810,.15,'triangle',.03,160)}
  if(name==='laser')beep(720,.09,'sawtooth',.025,-310);
  if(name==='spread'){beep(470,.12,'triangle',.04,260);beep(640,.1,'sine',.025,-180)}
  if(name==='bombLaunch')beep(250,.12,'square',.035,-150);
  if(name==='bomb'){beep(150,.3,'sawtooth',.06,-105);beep(90,.36,'triangle',.045,-50)}
  if(name==='boss'){beep(180,.18,'sawtooth',.035,100);beep(270,.23,'triangle',.04,180)}
  if(name==='bossShot'){beep(390,.1,'square',.025,250)}
  if(name==='playerHit'){beep(190,.16,'sawtooth',.045,-120)}
  if(name==='hitBoss')beep(260,.12,'square',.04,-100);
  if(name==='life')beep(300,.24,'sawtooth',.04,-190);
  if(name==='gameover'){beep(300,.25,'triangle',.04,-100);beep(200,.4,'triangle',.04,-140)}
}
function updateFireButton(){
  const canFire=heldWeapon&&weaponAmmo>0&&(state==='play'||state==='boss');
  fireButton.disabled=!canFire;
  fireButton.textContent=heldWeapon?`TEMBAK ${WEAPONS[heldWeapon].label} ×${weaponAmmo}`:'TEMBAK · F';
}
function paddleWidth(){return PADDLE_WIDTHS[diff]}
function buildBricks(){
  bricks=[];
  const rows=5+Math.min(2,Math.floor((level-1)/2));
  const brickW=(W-BRICK_LEFT*2-BRICK_GAP*(BRICK_COLS-1))/BRICK_COLS;
  for(let row=0;row<rows;row++)for(let col=0;col<BRICK_COLS;col++){
    const hp=row===0&&level>1?2:1;
    bricks.push({x:BRICK_LEFT+col*(brickW+BRICK_GAP),y:BRICK_TOP+row*(BRICK_H+BRICK_GAP),w:brickW,h:BRICK_H,row,hp,maxHp:hp,color:PALETTE[(row+level-1)%PALETTE.length]});
  }
}
function serve(){
  ball.x=paddle.x+paddleWidth()/2;ball.y=PADDLE_Y-BALL_R-2;
  const speed=BALL_SPEEDS[diff]+Math.min(2,(level-1)*.25),angle=(Math.random()-.5)*.72;
  ball.vx=Math.sin(angle)*speed;ball.vy=-Math.cos(angle)*speed;serveT=.7;
}
function begin(){
  score=0;lives=3;level=1;particles=[];boss=null;powerups=[];shots=[];enemyShots=[];heldWeapon=null;weaponAmmo=0;
  buildBricks();state='play';serve();playSound('start');updateFireButton();
}
function nextLevel(){
  level++;buildBricks();powerups=[];shots=[];enemyShots=[];paddle.x=clamp(paddle.x,0,W-paddleWidth());serve();state='play';updateFireButton();
}
function pointerX(e){
  const r=cv.getBoundingClientRect();
  return (e.clientX-r.left)/r.width*W;
}
cv.addEventListener('pointermove',e=>{paddle.x=clamp(pointerX(e)-paddleWidth()/2,0,W-paddleWidth())});
cv.addEventListener('pointerdown',e=>{
  paddle.x=clamp(pointerX(e)-paddleWidth()/2,0,W-paddleWidth());
  if(state==='ready'||state==='over')begin();
  else if(state==='paused')state=pausedState;
  else if(e.pointerType==='mouse'&&e.button===0&&(state==='play'||state==='boss'))fireWeapon();
  updateFireButton();
});
addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();keys[key]=true;
  if(['arrowleft','arrowright',' '].includes(key))e.preventDefault();
  if(key==='f'){e.preventDefault();fireWeapon()}
  if(e.code==='Space'){
    if(state==='play'||state==='boss'){pausedState=state;state='paused'}
    else if(state==='paused')state=pausedState;
    else if(state==='ready'||state==='over')begin();
  }
  updateFireButton();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
document.getElementById('seg').addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  diff=Number(button.dataset.d);
  document.querySelectorAll('#seg button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
  paddle.x=clamp(paddle.x,0,W-paddleWidth());
});
soundButton.addEventListener('click',()=>{
  soundEnabled=!soundEnabled;
  soundButton.setAttribute('aria-pressed',String(soundEnabled));
  soundButton.textContent=soundEnabled?'🔊 Suara ON':'🔇 Suara OFF';
  if(soundEnabled)playSound('pickup');
});
fireButton.addEventListener('click',fireWeapon);
function burst(x,y,color,count=9){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:24+Math.random()*20,max:44,size:2+Math.random()*3,color});
  }
}
function spawnPowerup(x,y){
  if(powerups.length>=3||Math.random()>.22)return;
  const types=Object.keys(WEAPONS),type=types[Math.floor(Math.random()*types.length)];
  powerups.push({x,y,r:12,vy:1.6,type,spin:0});
}
function startBoss(){
  if(state==='boss')return;
  const maxHp=30+level*8;
  state='boss';boss={x:W/2,y:195,t:0,hp:maxHp,maxHp,flash:0,shootTimer:1.1};
  playSound('boss');updateFireButton();
}
function damageBrick(index,x,y,quiet=false){
  const brick=bricks[index];if(!brick)return;
  if(brick.hp>1){
    brick.hp--;score+=4;burst(x,y,brick.color,5);
  }else{
    score+=10;burst(brick.x+brick.w/2,brick.y+brick.h/2,brick.color,12);
    spawnPowerup(brick.x+brick.w/2,brick.y+brick.h/2);bricks.splice(index,1);
  }
  if(!quiet)playSound('brick');
  if(bricks.length===0)startBoss();
}
function damageBoss(damage,x,y){
  if(!boss)return;
  boss.hp-=damage;boss.flash=.2;score+=25;burst(x,y,'#ffb84d',14);playSound('hitBoss');
  if(boss.hp<=0){boss=null;state='levelclear';clearT=1.1;updateFireButton()}
}
function explode(x,y){
  const targetBoss=boss;
  burst(x,y,'#ff984f',30);playSound('bomb');
  for(let i=bricks.length-1;i>=0;i--){
    const b=bricks[i],bx=b.x+b.w/2,by=b.y+b.h/2;
    if(Math.hypot(bx-x,by-y)<=98)damageBrick(i,bx,by,true);
  }
  if(targetBoss&&boss===targetBoss&&Math.hypot(boss.x-x,boss.y-y)<125)damageBoss(3,x,y);
}
function fireWeapon(){
  if(!heldWeapon||weaponAmmo<=0||(state!=='play'&&state!=='boss'))return;
  const x=paddle.x+paddleWidth()/2,y=PADDLE_Y-8;
  if(heldWeapon==='spread'){
    [-1,0,1].forEach(side=>shots.push({x,y,vx:side*2.5,vy:-9,type:'spread',r:4}));
    playSound('spread');
  }else if(heldWeapon==='bomb'){
    shots.push({x,y,vx:0,vy:-6.5,type:'bomb',r:9});
    playSound('bombLaunch');
  }else{
    shots.push({x,y,vx:0,vy:-10,type:'laser',r:4});
    playSound('laser');
  }
  weaponAmmo--;
  if(weaponAmmo===0)heldWeapon=null;
  updateFireButton();
}
function loseLife(){
  lives--;
  enemyShots=[];
  burst(ball.x,H-8,'#ff648b',18);
  playSound(lives<=0?'gameover':'playerHit');
  if(lives<=0){state='over';updateFireButton();return}
  serve();
}
function collideBrick(){
  for(let i=bricks.length-1;i>=0;i--){
    const b=bricks[i],nearX=clamp(ball.x,b.x,b.x+b.w),nearY=clamp(ball.y,b.y,b.y+b.h);
    const dx=ball.x-nearX,dy=ball.y-nearY;
    if(dx*dx+dy*dy>BALL_R*BALL_R)continue;
    if(Math.abs(dx)>Math.abs(dy))ball.vx=dx<0?-Math.abs(ball.vx):Math.abs(ball.vx);
    else ball.vy=dy<0?-Math.abs(ball.vy):Math.abs(ball.vy);
    damageBrick(i,ball.x,ball.y);
    return;
  }
  if(bricks.length===0)startBoss();
}
function collideBoss(){
  const left=boss.x-73,right=boss.x+73,top=boss.y-100,bottom=boss.y+100;
  const nearX=clamp(ball.x,left,right),nearY=clamp(ball.y,top,bottom);
  const dx=ball.x-nearX,dy=ball.y-nearY;
  if(dx*dx+dy*dy>BALL_R*BALL_R)return;
  if(Math.abs(dx)>Math.abs(dy)){
    ball.vx=dx<0?-Math.abs(ball.vx):Math.abs(ball.vx);
    ball.x=dx<0?left-BALL_R:right+BALL_R;
  }else{
    ball.vy=dy<0?-Math.abs(ball.vy):Math.abs(ball.vy);
    ball.y=dy<0?top-BALL_R:bottom+BALL_R;
  }
  damageBoss(1,ball.x,ball.y);
}
function bossShoot(){
  const firingFrame=bossSpriteFrames[3],spriteHeight=245;
  const handOffset=firingFrame?spriteHeight*firingFrame.width/firingFrame.height*.42:68;
  const x=boss.x+handOffset,y=boss.y-18,targetX=paddle.x+paddleWidth()/2,targetY=PADDLE_Y;
  const dx=targetX-x,dy=targetY-y,distance=Math.hypot(dx,dy),speed=3.1+Math.min(1,level*.12);
  boss.muzzle=.16;
  enemyShots.push({x,y,vx:dx/distance*speed,vy:dy/distance*speed,size:9});
  playSound('bossShot');
}
function updateBossShots(dt){
  for(let i=enemyShots.length-1;i>=0;i--){
    const shot=enemyShots[i];shot.x+=shot.vx*dt;shot.y+=shot.vy*dt;
    if(shot.x+shot.size/2>=paddle.x&&shot.x-shot.size/2<=paddle.x+paddleWidth()&&shot.y+shot.size/2>=PADDLE_Y&&shot.y-shot.size/2<=PADDLE_Y+PADDLE_H){
      loseLife();return;
    }
    if(shot.y>H+shot.size)enemyShots.splice(i,1);
  }
}
function updateWeapons(dt){
  for(let i=powerups.length-1;i>=0;i--){
    const item=powerups[i];item.y+=item.vy*dt;item.spin+=.08*dt;
    if(item.y+item.r>=PADDLE_Y&&item.y-item.r<=PADDLE_Y+PADDLE_H&&item.x>=paddle.x-item.r&&item.x<=paddle.x+paddleWidth()+item.r){
      heldWeapon=item.type;weaponAmmo=WEAPONS[item.type].ammo;powerups.splice(i,1);
      playSound('pickup');updateFireButton();
    }else if(item.y>H+item.r)powerups.splice(i,1);
  }
  for(let i=shots.length-1;i>=0;i--){
    const shot=shots[i],steps=Math.max(1,Math.ceil(Math.abs(shot.vy)*dt/5));
    let remove=false;
    for(let step=0;step<steps;step++){
      shot.x+=shot.vx*dt/steps;shot.y+=shot.vy*dt/steps;
      if(shot.type==='bomb'){
        const hitIndex=bricks.findIndex(b=>shot.x+shot.r>=b.x&&shot.x-shot.r<=b.x+b.w&&shot.y+shot.r>=b.y&&shot.y-shot.r<=b.y+b.h);
        if(hitIndex>=0){explode(shot.x,shot.y);remove=true;break}
      }else{
        const hitIndex=bricks.findIndex(b=>shot.x+shot.r>=b.x&&shot.x-shot.r<=b.x+b.w&&shot.y+shot.r>=b.y&&shot.y-shot.r<=b.y+b.h);
        if(hitIndex>=0){damageBrick(hitIndex,shot.x,shot.y);remove=true;break}
      }
      if(state==='boss'&&boss&&shot.x>=boss.x-76&&shot.x<=boss.x+76&&shot.y>=boss.y-100&&shot.y<=boss.y+100){
        if(shot.type==='bomb')explode(shot.x,shot.y);else damageBoss(shot.type==='spread'?1:2,shot.x,shot.y);
        remove=true;break;
      }
      if(shot.y+shot.r<0){remove=true;break}
    }
    if(remove)shots.splice(i,1);
  }
}
function update(dt){
  const pw=paddleWidth();
  if(keys['arrowleft']||keys['a'])paddle.x-=8*dt;
  if(keys['arrowright']||keys['d'])paddle.x+=8*dt;
  paddle.x=clamp(paddle.x,0,W-pw);
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.035*dt;p.life-=dt});
  if(state==='levelclear'){clearT-=dt/60;if(clearT<=0)nextLevel();return}
  if(state!=='play'&&state!=='boss')return;
  updateWeapons(dt);
  if(state==='levelclear')return;
  if(serveT>0){
    serveT-=dt/60;ball.x=paddle.x+pw/2;ball.y=PADDLE_Y-BALL_R-2;return;
  }
  const steps=Math.max(1,Math.ceil(Math.max(Math.abs(ball.vx),Math.abs(ball.vy))*dt/(BALL_R*.8)));
  const step=dt/steps;
  if(state==='boss'){
    boss.t+=dt/60;boss.x=W/2+Math.sin(boss.t*1.35)*145;boss.y=187+Math.sin(boss.t*2)*8;
    boss.flash=Math.max(0,boss.flash-dt/60);
    boss.muzzle=Math.max(0,boss.muzzle-dt/60);
    boss.shootTimer-=dt/60;
    if(boss.shootTimer<=0){bossShoot();boss.shootTimer=Math.max(.75,1.4-level*.04)}
    updateBossShots(dt);
    if(state==='over')return;
  }
  for(let i=0;i<steps;i++){
    const oldY=ball.y;
    ball.x+=ball.vx*step;ball.y+=ball.vy*step;
    if(ball.x<BALL_R){ball.x=BALL_R;ball.vx=Math.abs(ball.vx)}
    if(ball.x>W-BALL_R){ball.x=W-BALL_R;ball.vx=-Math.abs(ball.vx)}
    if(ball.y<BALL_R){ball.y=BALL_R;ball.vy=Math.abs(ball.vy)}
    if(ball.vy>0&&oldY+BALL_R<=PADDLE_Y&&ball.y+BALL_R>=PADDLE_Y&&ball.x>=paddle.x-BALL_R&&ball.x<=paddle.x+pw+BALL_R){
      ball.y=PADDLE_Y-BALL_R;
      const offset=clamp((ball.x-(paddle.x+pw/2))/(pw/2),-1,1);
      const speed=Math.hypot(ball.vx,ball.vy),angle=offset*1.05;
      ball.vx=Math.sin(angle)*speed;ball.vy=-Math.cos(angle)*speed;
      burst(ball.x,PADDLE_Y,'#77efff',4);
      playSound('paddle');
    }
    if(state==='boss')collideBoss();else collideBrick();
    if(state==='levelclear')return;
    if(ball.y>H+BALL_R){loseLife();return}
  }
}
function roundedRect(x,y,w,h,r){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
}
function draw(){
  const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#111a35');bg.addColorStop(.55,'#0c142b');bg.addColorStop(1,'#11102b');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#c9d5ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
  ctx.textBaseline='middle';ctx.textAlign='left';ctx.font='700 14px Inter,system-ui,sans-serif';ctx.fillStyle='#dce6ff';
  ctx.fillText('SKOR  '+String(score).padStart(4,'0'),24,32);
  ctx.textAlign='center';ctx.fillStyle='#aab8dc';ctx.fillText('LEVEL  '+level,W/2,32);
  ctx.textAlign='right';ctx.fillStyle='#dce6ff';ctx.fillText('NYAWA  '+('♥ '.repeat(Math.max(0,lives))),W-24,32);
  ctx.strokeStyle='#344368';ctx.globalAlpha=.7;ctx.beginPath();ctx.moveTo(22,54);ctx.lineTo(W-22,54);ctx.stroke();ctx.globalAlpha=1;
  if((state==='boss'||(state==='paused'&&pausedState==='boss'))&&boss)drawBoss();
  bricks.forEach(b=>{
    ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=b.hp>1?17:9;
    const grad=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);grad.addColorStop(0,b.color);grad.addColorStop(1,b.hp>1?'#7047cf':'#342e68');
    roundedRect(b.x,b.y,b.w,b.h,6);ctx.fillStyle=grad;ctx.fill();
    ctx.shadowBlur=0;roundedRect(b.x+2,b.y+2,b.w-4,4,2);ctx.fillStyle='#ffffff45';ctx.fill();
    if(b.hp>1){ctx.fillStyle='#fff';ctx.font='700 11px Inter,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('×'+b.hp,b.x+b.w/2,b.y+b.h/2+1)}
    ctx.restore();
  });
  powerups.forEach(item=>{
    const color=WEAPONS[item.type].color;
    ctx.save();ctx.translate(item.x,item.y);ctx.rotate(item.spin);
    ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(0,0,item.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,item.r+4,0,Math.PI*2);ctx.stroke();
    ctx.rotate(-item.spin);ctx.shadowBlur=0;ctx.fillStyle='#11182c';ctx.font='900 11px Inter,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(item.type==='laser'?'L':item.type==='spread'?'M':'B',0,1);ctx.restore();
  });
  shots.forEach(shot=>{
    const color=shot.type==='bomb'?WEAPONS.bomb.color:WEAPONS[shot.type].color;
    ctx.save();ctx.strokeStyle=color;ctx.lineWidth=shot.type==='bomb'?4:3;ctx.shadowColor=color;ctx.shadowBlur=16;
    ctx.beginPath();ctx.moveTo(shot.x,shot.y+14);ctx.lineTo(shot.x,shot.y);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(shot.x,shot.y,shot.r,0,Math.PI*2);ctx.fill();ctx.restore();
  });
  enemyShots.forEach(shot=>{
    ctx.save();ctx.shadowColor='#ff704f';ctx.shadowBlur=18;ctx.fillStyle='#ff704f';
    ctx.fillRect(Math.round(shot.x-4),Math.round(shot.y-4),8,8);
    ctx.fillStyle='#fff1ab';ctx.fillRect(Math.round(shot.x-1),Math.round(shot.y-1),3,3);ctx.restore();
  });
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.shadowBlur=0;
  const pw=paddleWidth(),pg=ctx.createLinearGradient(paddle.x,PADDLE_Y,paddle.x+pw,PADDLE_Y);
  pg.addColorStop(0,'#54e6ff');pg.addColorStop(.5,'#8e83ff');pg.addColorStop(1,'#ff70c5');
  ctx.shadowColor='#69dfff';ctx.shadowBlur=20;roundedRect(paddle.x,PADDLE_Y,pw,PADDLE_H,7);ctx.fillStyle=pg;ctx.fill();ctx.shadowBlur=0;
  const glow=ctx.createRadialGradient(ball.x,ball.y,1,ball.x,ball.y,22);glow.addColorStop(0,'#fff');glow.addColorStop(.25,'#9ff8ff');glow.addColorStop(1,'#59baff00');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(ball.x,ball.y,22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.shadowColor='#8df4ff';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='600 12px Inter,system-ui,sans-serif';
  ctx.fillStyle=heldWeapon?WEAPONS[heldWeapon].color:'#7180a3';
  ctx.fillText(heldWeapon?`SENJATA ${WEAPONS[heldWeapon].label} ×${weaponAmmo}  ·  F`: 'HANCURKAN BLOK UNTUK MENCARI SENJATA',24,H-15);
  if(state!=='play'&&state!=='boss'&&state!=='levelclear'){
    ctx.fillStyle='#070b18b8';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='#8d82ff';ctx.shadowBlur=25;ctx.font='800 44px Inter,system-ui,sans-serif';
    const title=state==='ready'?'RZK PONG':state==='paused'?'JEDA':'GAME OVER';ctx.fillText(title,W/2,H/2-36);ctx.shadowBlur=0;
    ctx.fillStyle='#c3cee9';ctx.font='500 16px Inter,system-ui,sans-serif';
    const subtitle=state==='ready'?'Hancurkan blok-bloknya dan jangan sampai bola jatuh!':state==='paused'?'Tekan spasi atau ketuk layar untuk lanjut':'Skor akhir: '+score+'  ·  Ketuk atau tekan spasi untuk bermain lagi';
    ctx.fillText(subtitle,W/2,H/2+18);
    if(state==='ready'){ctx.fillStyle='#75eaff';ctx.font='700 14px Inter,system-ui,sans-serif';ctx.fillText('KETUK LAYAR ATAU TEKAN SPASI',W/2,H/2+62)}
  }
  if(state==='levelclear'){
    ctx.fillStyle='#080d1dcc';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='800 34px Inter,system-ui,sans-serif';ctx.fillText('LEVEL SELESAI!',W/2,H/2);
    ctx.fillStyle='#9ff8ff';ctx.font='600 16px Inter,system-ui,sans-serif';ctx.fillText('Bersiap untuk tantangan berikutnya…',W/2,H/2+38);
  }
}
function drawBoss(){
  const x=boss.x,y=boss.y,size=5,left=x-14*size,top=y-18*size;
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffce68';ctx.font='800 13px Inter,system-ui,sans-serif';
  ctx.fillText('RAJA PIXEL RZK',W/2,70);
  roundedRect(W/2-145,81,290,9,5);ctx.fillStyle='#27304f';ctx.fill();
  roundedRect(W/2-145,81,290*(boss.hp/boss.maxHp),9,5);
  const hpGrad=ctx.createLinearGradient(W/2-145,0,W/2+145,0);hpGrad.addColorStop(0,'#ff4f87');hpGrad.addColorStop(1,'#ffc857');ctx.fillStyle=hpGrad;ctx.fill();
  ctx.textAlign='left';ctx.fillStyle='#dce6ff';ctx.font='700 11px Inter,system-ui,sans-serif';
  ctx.fillText(`${boss.hp}/${boss.maxHp}`,W/2+151,85);
  if(bossSpriteFrames.length===4){
    const frame=bossSpriteFrames[boss.muzzle>0?3:0],height=245,width=height*frame.width/frame.height;
    ctx.shadowColor=boss.flash>0?'#fff5b0':'#ffb84f';ctx.shadowBlur=20;
    ctx.imageSmoothingEnabled=false;ctx.drawImage(bossSprite,frame.x,0,frame.width,frame.height,x-width/2,y-height/2+14,width,height);ctx.shadowBlur=0;
    if(boss.muzzle>0){
      const handX=x+width*.42,handY=y-18;
      ctx.shadowColor='#4beaff';ctx.shadowBlur=18;ctx.fillStyle='#4beaff';ctx.fillRect(handX,handY-4,10,8);
      ctx.fillStyle='#fff';ctx.fillRect(handX+7,handY-2,7,4);ctx.shadowBlur=0;
    }
    if(boss.flash>0){ctx.globalAlpha=.35;ctx.fillStyle='#fff';ctx.fillRect(x-width/2,y-height/2,width,height);ctx.globalAlpha=1}
    ctx.restore();return;
  }
  const pixel=(gx,gy,gw,gh,color)=>{
    ctx.fillStyle=color;ctx.fillRect(left+gx*size,top+gy*size,gw*size,gh*size);
  };
  ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(x,y+86,62,9,0,0,Math.PI*2);ctx.fill();
  const outline='#111114',suit='#292b30',skin='#e99a67';
  pixel(5,0,18,1,outline);pixel(3,1,22,1,outline);pixel(2,2,24,1,outline);
  pixel(1,3,26,1,outline);pixel(0,4,28,5,outline);pixel(1,9,26,1,outline);
  pixel(20,1,3,6,'#282630');pixel(2,4,2,4,'#050506');
  pixel(3,11,3,5,outline);pixel(22,11,3,5,outline);
  pixel(5,9,18,1,outline);pixel(4,10,20,7,outline);pixel(5,17,18,2,outline);pixel(7,19,14,1,outline);
  pixel(5,10,18,7,skin);pixel(7,17,14,2,'#f1ae78');
  pixel(4,12,2,3,'#b65f50');pixel(23,12,1,3,'#b65f50');
  pixel(8,12,4,2,'#f8ead2');pixel(17,12,4,2,'#f8ead2');
  pixel(9,12,2,2,outline);pixel(18,12,2,2,outline);
  pixel(8,11,4,1,'#52363a');pixel(17,11,4,1,'#52363a');
  pixel(13,14,2,2,'#c97153');pixel(11,17,6,1,'#713c3d');pixel(12,18,4,1,'#f4c18c');
  pixel(11,20,6,3,'#e5a078');pixel(10,21,8,1,'#f3f0e8');
  pixel(3,22,22,3,outline);pixel(4,21,20,10,outline);pixel(5,30,18,1,outline);
  pixel(4,22,20,8,suit);pixel(5,30,18,1,'#1b1c20');
  pixel(3,23,3,7,'#1d1f24');pixel(2,29,4,2,'#16171b');
  pixel(1,31,5,1,'#f0ece4');pixel(2,32,4,2,'#d9895e');pixel(2,34,4,1,outline);
  pixel(23,22,3,3,'#1d1f24');pixel(24,20,3,3,'#24262b');
  pixel(25,18,3,3,'#16171b');pixel(26,16,2,3,'#17181c');
  pixel(25,11,2,1,'#d9895e');pixel(26,10,1,2,'#d9895e');
  pixel(24,12,4,3,'#e99a67');pixel(25,15,3,2,'#d9895e');
  pixel(25,21,1,2,'#f0ece4');
  pixel(8,31,5,4,'#191a1e');pixel(16,31,5,4,'#191a1e');
  pixel(7,35,7,1,outline);pixel(15,35,8,1,outline);
  pixel(8,35,4,1,'#555963');pixel(16,35,5,1,'#555963');
  pixel(12,22,4,1,'#f1f0eb');pixel(13,23,2,1,'#f1f0eb');
  pixel(13,24,2,4,'#a91e37');pixel(12,28,4,1,'#86182d');
  pixel(7,23,5,3,'#111a2d');pixel(7,23,5,1,'#69dff0');
  ctx.fillStyle='#9ff8ff';ctx.font='900 7px monospace';ctx.textAlign='center';ctx.fillText('RZK',left+9.5*size,top+24.5*size);
  pixel(17,25,1,1,'#c5c6cb');pixel(17,28,1,1,'#c5c6cb');
  if(boss.muzzle>0){
    pixel(27,12,2,3,'#38dfff');pixel(28,13,2,1,'#eaffff');
  }
  if(boss.flash>0){ctx.globalAlpha=.4;pixel(0,0,28,36,'#fff');ctx.globalAlpha=1}
  ctx.restore();
}
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/16.667,3);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
buildBricks();requestAnimationFrame(loop);
</script>
